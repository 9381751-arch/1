[project]
name = "azimut-bot"
version = "0.1.0"
description = "Telegram-бот автоматизации закупки б/у шпунта (АЗИМУТ)"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4",
    "anthropic>=0.39",
    "supabase>=2.7",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
